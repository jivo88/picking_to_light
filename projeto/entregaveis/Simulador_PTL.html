  --sans: system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme=&quot;light&quot;]) {
  --bg: #11161f; --painel: #19202c; --tinta: #e8ecf2; --suave: #9aa6b8; --linha: #2c3647; --chip: #202938;
  --verdeF: #17301f; --ambarF: #3a2a10; --vermelhoF: #3b1714; color-scheme: dark; } }
:root[data-theme=&quot;dark&quot;] { --bg: #11161f; --painel: #19202c; --tinta: #e8ecf2; --suave: #9aa6b8; --linha: #2c3647; --chip: #202938;
  --verdeF: #17301f; --ambarF: #3a2a10; --vermelhoF: #3b1714; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--tinta); font: 13.5px/1.45 var(--sans); padding: 10px 12px 18px; }
button, select, input { font: inherit; color: inherit; }
h2 { font-size: 12px; margin: 0 0 8px; color: var(--suave); text-transform: uppercase; letter-spacing: .6px; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
.topo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.topo .tit { font-size: 16px; font-weight: 700; }
.topo .sub { color: var(--suave); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.chip::before { content: &quot;&quot;; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.ok { background: var(--verdeF); color: var(--verde); } .falha { background: var(--vermelhoF); color: var(--vermelho); } .cad { background: var(--ambarF); color: var(--ambar); }
.acoesTopo { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { background: var(--painel); border: 1px solid var(--linha); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--azul); }
.btn.forte { background: var(--vermelho); border-color: var(--vermelho); color: #fff; font-weight: 700; }
.btn.ambar { background: #f2a33a; border-color: #f2a33a; color: #1b2638; font-weight: 700; }
.btn.mini { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
select.btn { padding: 5px 8px; }
.caixa { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 12px; margin-bottom: 10px; min-width: 0; }
#alertas:empty::before { content: &quot;Nenhuma falha. Use \&quot;Simular falha\&quot; para ver como o aviso chega aqui.&quot;; color: var(--suave); }
.alerta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; border: 1px solid var(--vermelho); border-left-width: 5px;
  border-radius: 10px; padding: 10px 12px; background: var(--vermelhoF); margin-bottom: 8px; }
.alerta.cad { border-color: var(--ambar); background: var(--ambarF); }
.alerta .end { font-family: var(--mono); font-size: 20px; font-weight: 800; letter-spacing: .5px; }
.alerta .det { font-size: 12.5px; }
.alerta .det b { font-weight: 700; }
.alerta .bts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 640px) { .alerta { grid-template-columns: 1fr; } .alerta .bts { justify-content: flex-start; } }
#cadastro[hidden] { display: none; }
.passos { list-style: none; margin: 8px 0 10px; padding: 0; display: grid; gap: 6px; }
.passos li { display: flex; gap: 10px; align-items: flex-start; }
.passos .n { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--chip); border: 1px solid var(--linha); }
.passos li.feito .n { background: var(--verde); border-color: var(--verde); color: #fff; }
.passos li.agora .n { background: #f2a33a; border-color: #f2a33a; color: #1b2638; animation: pulsa 1s infinite; }
@keyframes pulsa { 50% { box-shadow: 0 0 0 5px rgba(242, 163, 58, .25); } }
@media (prefers-reduced-motion: reduce) { .passos li.agora .n { animation: none; } }
.cadEnd { font-family: var(--mono); font-size: 18px; font-weight: 800; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.filtros input { flex: 1 1 220px; min-width: 0; background: var(--bg); border: 1px solid var(--linha); border-radius: 8px; padding: 6px 10px; }
.contagem { color: var(--suave); font-size: 12px; }
.tabWrap { overflow: auto; max-height: 46vh; border: 1px solid var(--linha); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { position: sticky; top: 0; background: var(--chip); text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--suave); padding: 6px 8px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
td { padding: 5px 8px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
tr.lf td { background: var(--vermelhoF); } tr.lc td { background: var(--ambarF); }
td.end { font-family: var(--mono); font-weight: 700; }
td.mono { font-family: var(--mono); font-size: 12px; color: var(--suave); }
td .bts { display: flex; gap: 4px; }
#hist { list-style: none; margin: 0; padding: 0; max-height: 160px; overflow-y: auto; font-size: 12.5px; }
#hist li { padding: 4px 0; border-bottom: 1px solid var(--linha); display: grid; grid-template-columns: 58px 86px minmax(0, 1fr); gap: 6px; }
#hist .t { color: var(--suave); font-family: var(--mono); }
#hist:empty::before { content: &quot;Sem eventos ainda.&quot;; color: var(--suave); }
.nota { color: var(--suave); font-size: 12px; margin: 6px 0 0; }

&lt;body&gt;
&lt;div class=&quot;topo&quot;&gt;
  &lt;div&gt;&lt;div class=&quot;tit&quot;&gt;Interface de controle&lt;/div&gt;&lt;div class=&quot;sub&quot; id=&quot;sub&quot;&gt;Estação — · aguardando o simulador&lt;/div&gt;&lt;/div&gt;
  &lt;span class=&quot;chip ok&quot; id=&quot;chipConc&quot;&gt;Concentrador online&lt;/span&gt;

    &lt;select class=&quot;btn&quot; id=&quot;selFalha&quot; aria-label=&quot;Tipo de falha&quot;&gt;
      &lt;option value=&quot;&quot;&gt;Falha aleatória&lt;/option&gt;
      &lt;option value=&quot;display&quot;&gt;Display do módulo Q sem resposta&lt;/option&gt;

&lt;section class=&quot;caixa&quot;&gt;&lt;h2&gt;Alertas de LED&lt;/h2&gt;&lt;div id=&quot;alertas&quot;&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;caixa&quot; id=&quot;cadastro&quot; hidden&gt;
  &lt;h2&gt;Cadastro de LED em andamento&lt;/h2&gt;
  &lt;div class=&quot;cadEnd&quot; id=&quot;cadEnd&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;det&quot; id=&quot;cadDet&quot;&gt;&lt;/div&gt;

    &lt;button class=&quot;btn ambar&quot; id=&quot;btnApertar&quot;&gt;Simular aperto no botão do módulo novo&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;btnVer&quot;&gt;Ver no 3D&lt;/button&gt;

  &lt;/div&gt;

&lt;section class=&quot;caixa&quot;&gt;
  &lt;h2&gt;LEDs cadastrados por endereço&lt;/h2&gt;
  &lt;div class=&quot;filtros&quot;&gt;
    &lt;input id=&quot;busca&quot; type=&quot;search&quot; placeholder=&quot;Buscar endereço, módulo ou serial (ex.: 0.05.0421.A)&quot; aria-label=&quot;Buscar&quot;&gt;
    &lt;select class=&quot;btn&quot; id=&quot;filtro&quot; aria-label=&quot;Filtro&quot;&gt;
      &lt;option value=&quot;&quot;&gt;Todos&lt;/option&gt;
      &lt;option value=&quot;falha&quot;&gt;Com falha&lt;/option&gt;
      &lt;option value=&quot;Q&quot;&gt;Módulos Q (alto giro 0-3)&lt;/option&gt;

  &lt;/div&gt;
  &lt;div class=&quot;tabWrap&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Endereço&lt;/th&gt;&lt;th&gt;Display&lt;/th&gt;&lt;th&gt;Ligação&lt;/th&gt;&lt;th&gt;Serial&lt;/th&gt;&lt;th&gt;Local&lt;/th&gt;&lt;th&gt;Situação&lt;/th&gt;&lt;th&gt;Ações&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody id=&quot;tbody&quot;&gt;&lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;p class=&quot;nota&quot;&gt;Módulo Q não tem microcontrolador: ele é identificado pelo nó e pela porta (o serial é o do nó). Módulo E+Q tem serial próprio e endereço RS-485.&lt;/p&gt;

&lt;section class=&quot;caixa&quot;&gt;&lt;h2&gt;Histórico&lt;/h2&gt;&lt;ul id=&quot;hist&quot;&gt;&lt;/ul&gt;&lt;/section&gt;

&lt;script&gt;
(() =&gt; {
  &#x27;use strict&#x27;;
  const $ = (s) =&gt; document.querySelector(s);
  const esc = (s) =&gt; String(s == null ? &#x27;&#x27; : s).replace(/&amp;/g, &#x27;&amp;amp;&#x27;).replace(/&lt;/g, &#x27;&amp;lt;&#x27;);
  const paraPai = (m) =&gt; { try { window.parent.postMessage(Object.assign({ ptlFilho: true, origem: &#x27;ctl&#x27; }, m), &#x27;*&#x27;); } catch (e) { /* fora da versão unificada */ } };
  const S = { est: &#x27;—&#x27;, segmento: &#x27;&#x27;, lista: [], cad: null, conc: true };
  const t0 = Date.now();
  const hora = () =&gt; { const s = Math.floor((Date.now() - t0) / 1000); return `${String(Math.floor(s / 60)).padStart(2, &#x27;0&#x27;)}:${String(s % 60).padStart(2, &#x27;0&#x27;)}`; };

  function historico(tipo, txt, cls) {
    const li = document.createElement(&#x27;li&#x27;);
    li.innerHTML = `&lt;span class=&quot;t&quot;&gt;${hora()}&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;chip ${cls}&quot;&gt;${esc(tipo)}&lt;/span&gt;&lt;/span&gt;&lt;span&gt;${txt}&lt;/span&gt;`;
    $(&#x27;#hist&#x27;).prepend(li);
    while ($(&#x27;#hist&#x27;).children.length &gt; 60) $(&#x27;#hist&#x27;).lastChild.remove();
  }
  const rotEnds = (d) =&gt; (d.enderecos.length &gt; 1 ? `${d.enderecos.length} endereços` : d.enderecos[0] || &#x27;&#x27;);
  const situacao = (d) =&gt; (d.status === &#x27;falha&#x27; ? &#x27;&lt;span class=&quot;chip falha&quot;&gt;Falha&lt;/span&gt;&#x27; : d.status === &#x27;cadastro&#x27; ? &#x27;&lt;span class=&quot;chip cad&quot;&gt;Em cadastro&lt;/span&gt;&#x27; : &#x27;&lt;span class=&quot;chip ok&quot;&gt;OK&lt;/span&gt;&#x27;);

  function render() {
    const falhas = S.lista.filter((d) =&gt; d.status === &#x27;falha&#x27;);
    $(&#x27;#sub&#x27;).textContent = `Estação ${S.est}${S.segmento ? &#x27; · &#x27; + S.segmento : &#x27;&#x27;} · ${S.lista.length} displays · ${S.lista.reduce((s, d) =&gt; s + d.enderecos.length, 0)} endereços`;
    $(&#x27;#chipFalhas&#x27;).className = &#x27;chip &#x27; + (falhas.length ? &#x27;falha&#x27; : &#x27;ok&#x27;);
    $(&#x27;#chipFalhas&#x27;).textContent = falhas.length ? `${falhas.length} LED(s) com falha` : &#x27;Sem falhas&#x27;;
    $(&#x27;#chipConc&#x27;).className = &#x27;chip &#x27; + (S.conc ? &#x27;ok&#x27; : &#x27;falha&#x27;);
    $(&#x27;#chipConc&#x27;).textContent = S.conc ? &#x27;Concentrador online&#x27; : &#x27;Concentrador sem comunicação&#x27;;

    // alertas: qual LED falhou, onde está e o que fazer
    const al = $(&#x27;#alertas&#x27;);
    al.innerHTML = &#x27;&#x27;;
    falhas.forEach((d) =&gt; {
      const div = document.createElement(&#x27;div&#x27;);
      div.className = &#x27;alerta&#x27;;
      div.innerHTML = `&lt;div&gt;&lt;div class=&quot;end&quot;&gt;${esc(rotEnds(d))}&lt;/div&gt;
        &lt;div class=&quot;det&quot;&gt;&lt;b&gt;${esc(d.tipo === &#x27;Q&#x27; ? &#x27;Módulo Q&#x27; : &#x27;Módulo E+Q&#x27;)}&lt;/b&gt; · ${esc(d.modulo)} · barramento ${d.barramento} · ${esc(d.local)}&lt;br&gt;${esc(d.falha)}&lt;/div&gt;
        ${d.enderecos.length &gt; 1 ? `&lt;div class=&quot;det&quot;&gt;Endereços: ${esc(d.enderecos.slice(0, 6).join(&#x27;, &#x27;))}${d.enderecos.length &gt; 6 ? &#x27;…&#x27; : &#x27;&#x27;}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;
        &lt;div class=&quot;bts&quot;&gt;&lt;button class=&quot;btn mini&quot; data-a=&quot;ver&quot;&gt;Ver no 3D&lt;/button&gt;&lt;button class=&quot;btn mini forte&quot; data-a=&quot;cad&quot;&gt;Trocar e cadastrar&lt;/button&gt;&lt;/div&gt;`;
      div.querySelector(&#x27;[data-a=ver]&#x27;).onclick = () =&gt; paraPai({ tipo: &#x27;localizar&#x27;, cd: d.cds[0] });
      div.querySelector(&#x27;[data-a=cad]&#x27;).onclick = () =&gt; paraPai({ tipo: &#x27;cad_iniciar&#x27;, cd: d.cds[0] });
      al.appendChild(div);
    });

    // cadastro em andamento
    const emCad = S.lista.find((d) =&gt; d.status === &#x27;cadastro&#x27;);
    $(&#x27;#cadastro&#x27;).hidden = !emCad;
    if (emCad) {
      $(&#x27;#cadEnd&#x27;).textContent = rotEnds(emCad);
      $(&#x27;#cadDet&#x27;).textContent = `${emCad.tipo === &#x27;Q&#x27; ? &#x27;Módulo Q&#x27; : &#x27;Módulo E+Q&#x27;} · ${emCad.modulo} · ${emCad.local}`;
      const passos = [
        [&#x27;feito&#x27;, &#x27;Endereço escolhido nesta tela (ou lido na etiqueta com o coletor).&#x27;],
        [&#x27;feito&#x27;, emCad.tipo === &#x27;Q&#x27; ? &#x27;Módulo novo encaixado no RJ45 da mesma porta do nó.&#x27; : &#x27;Módulo novo encaixado no barramento (ele chega sem endereço, 0xF0).&#x27;],
        [&#x27;agora&#x27;, &#x27;O módulo novo está piscando CAd. Aperte o botão dele para confirmar.&#x27;],
        [&#x27;&#x27;, &#x27;O sistema grava o LED no endereço e o display volta a funcionar.&#x27;],
      ];
      $(&#x27;#passos&#x27;).innerHTML = passos.map(([c, t], i) =&gt; `&lt;li class=&quot;${c}&quot;&gt;&lt;span class=&quot;n&quot;&gt;${c === &#x27;feito&#x27; ? &#x27;✓&#x27; : i + 1}&lt;/span&gt;&lt;span&gt;${esc(t)}&lt;/span&gt;&lt;/li&gt;`).join(&#x27;&#x27;);
      $(&#x27;#btnVer&#x27;).onclick = () =&gt; paraPai({ tipo: &#x27;localizar&#x27;, cd: emCad.cds[0] });
    }
    tabela();
  }

  function linhas() {
    const out = [];
    S.lista.forEach((d) =&gt; d.enderecos.forEach((e, i) =&gt; out.push(Object.assign({}, d, { end: e, cd: d.cds[i] }))));
    return out.sort((a, b) =&gt; (a.cd &lt; b.cd ? -1 : 1));
  }
  function tabela() {
    const q = $(&#x27;#busca&#x27;).value.trim().toLowerCase(), f = $(&#x27;#filtro&#x27;).value;
    const ls = linhas().filter((r) =&gt; (!f || (f === &#x27;falha&#x27; ? r.status !== &#x27;ok&#x27; : r.tipo === f)) &amp;&amp;
      (!q || [r.end, r.cd, r.modulo, r.serial, r.local].join(&#x27; &#x27;).toLowerCase().includes(q)));
    $(&#x27;#contagem&#x27;).textContent = `${ls.length} endereço(s)`;
    $(&#x27;#tbody&#x27;).innerHTML = ls.slice(0, 400).map((r) =&gt; `&lt;tr class=&quot;${r.status === &#x27;falha&#x27; ? &#x27;lf&#x27; : r.status === &#x27;cadastro&#x27; ? &#x27;lc&#x27; : &#x27;&#x27;}&quot;&gt;
      &lt;td class=&quot;end&quot;&gt;${esc(r.end)}&lt;/td&gt;&lt;td&gt;${esc(r.tipo)}&lt;/td&gt;&lt;td&gt;${esc(r.modulo)} · bar. ${r.barramento}&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;${esc(r.serial || &#x27;—&#x27;)}&lt;/td&gt;
      &lt;td&gt;${esc(r.local)}&lt;/td&gt;&lt;td&gt;${situacao(r)}&lt;/td&gt;
      &lt;td&gt;&lt;div class=&quot;bts&quot;&gt;&lt;button class=&quot;btn mini&quot; data-a=&quot;id&quot; data-cd=&quot;${r.cd}&quot; ${r.status === &#x27;falha&#x27; ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;Testar&lt;/button&gt;&lt;button class=&quot;btn mini&quot; data-a=&quot;cad&quot; data-cd=&quot;${r.cd}&quot;&gt;Cadastrar&lt;/button&gt;&lt;button class=&quot;btn mini&quot; data-a=&quot;ver&quot; data-cd=&quot;${r.cd}&quot;&gt;3D&lt;/button&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);
  }
  $(&#x27;#tbody&#x27;).addEventListener(&#x27;click&#x27;, (e) =&gt; {
    const b = e.target.closest(&#x27;button&#x27;);
    if (!b) return;
    const cd = b.dataset.cd;
    if (b.dataset.a === &#x27;id&#x27;) paraPai({ tipo: &#x27;identificar&#x27;, cd });
    if (b.dataset.a === &#x27;cad&#x27;) paraPai({ tipo: &#x27;cad_iniciar&#x27;, cd });
    if (b.dataset.a === &#x27;ver&#x27;) paraPai({ tipo: &#x27;localizar&#x27;, cd });
  });
  $(&#x27;#busca&#x27;).addEventListener(&#x27;input&#x27;, tabela);
  $(&#x27;#filtro&#x27;).addEventListener(&#x27;change&#x27;, tabela);
  $(&#x27;#btnFalha&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; paraPai({ tipo: &#x27;falhar&#x27;, falha: $(&#x27;#selFalha&#x27;).value }));
  $(&#x27;#btnApertar&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; paraPai({ tipo: &#x27;cad_apertar&#x27; }));
  $(&#x27;#btnCancelarCad&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; paraPai({ tipo: &#x27;cad_cancelar&#x27; }));

  window.addEventListener(&#x27;message&#x27;, (e) =&gt; {
    const ev = e.data || {};
    if (!ev.ptl) return;
    const nome = ev.evento || ev.tipo;
    const dg = ev.diag;
    switch (nome) {
      case &#x27;estacao&#x27;:
        S.est = ev.est; S.segmento = ev.segmento || &#x27;&#x27;; S.lista = ev.registro || [];
        historico(&#x27;Mapa&#x27;, `Estação ${esc(ev.est)} carregada: ${S.lista.length} displays`, &#x27;ok&#x27;);
        break;
      case &#x27;registro&#x27;: S.lista = ev.lista || []; break;
      case &#x27;falha&#x27;: historico(&#x27;Falha&#x27;, `&lt;b&gt;${esc(rotEnds(dg))}&lt;/b&gt; · ${esc(dg.modulo)} · ${esc(ev.mensagem)}`, &#x27;falha&#x27;); break;
      case &#x27;cadastro_modo&#x27;: historico(&#x27;Cadastro&#x27;, `&lt;b&gt;${esc(rotEnds(dg))}&lt;/b&gt; · aguardando o botão do módulo novo`, &#x27;cad&#x27;); break;
      case &#x27;cadastro_ok&#x27;: historico(&#x27;Cadastrado&#x27;, `&lt;b&gt;${esc(rotEnds(dg))}&lt;/b&gt; · ${esc(dg.modulo)}${dg.tipo === &#x27;E+Q&#x27; ? ` · serial ${esc(dg.serial)} (antes ${esc(ev.serialAntigo)})` : &#x27;&#x27;}`, &#x27;ok&#x27;); break;
      case &#x27;cadastro_cancelado&#x27;: historico(&#x27;Cancelado&#x27;, `Cadastro de ${esc(rotEnds(dg))} cancelado`, &#x27;cad&#x27;); break;
      case &#x27;identificar&#x27;: historico(&#x27;Teste&#x27;, `${esc(rotEnds(dg))} mostrou 888 por 3 s`, &#x27;ok&#x27;); break;
      case &#x27;heartbeat&#x27;: S.conc = true; break;
      case &#x27;recusada&#x27;: S.conc = false; historico(&#x27;Rede&#x27;, &#x27;Concentrador sem comunicação: leitura recusada&#x27;, &#x27;falha&#x27;); break;
      case &#x27;abrir&#x27;: S.conc = true; break;
      default: return;
    }
    render();
  });
  render();
  paraPai({ tipo: &#x27;pronto&#x27; });
})();
&lt;/script&gt;
&lt;/body&gt;

&lt;html lang=&quot;pt-BR&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;Operação completa&lt;/title&gt;
&lt;style&gt;
/* Operação completa: simulação das duas linhas (Medicamento · Asi 3 e Perfumaria · Asi 1) com as 40 estações */
:root {
  --bg: #eef1f5; --painel: #ffffff; --tinta: #1b2638; --suave: #5b6675; --linha: #d5dbe3; --chip: #f6f8fb;
  --azul: #2f5597; --verde: #2e8b57; --ambar: #d68910; --vermelho: #c0392b; --med: #2f5597; --perf: #b0569b;
  --mono: ui-monospace, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace;
  --sans: system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme=&quot;light&quot;]) {
  --bg: #11161f; --painel: #19202c; --tinta: #e8ecf2; --suave: #9aa6b8; --linha: #2c3647; --chip: #202938;
  --med: #6f9be8; --perf: #e08ccd; color-scheme: dark; } }
:root[data-theme=&quot;dark&quot;] { --bg: #11161f; --painel: #19202c; --tinta: #e8ecf2; --suave: #9aa6b8; --linha: #2c3647; --chip: #202938;
  --med: #6f9be8; --perf: #e08ccd; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--tinta); font: 13.5px/1.45 var(--sans); padding: 10px 12px 18px; }
button, select, input { font: inherit; color: inherit; }
h2 { font-size: 12px; margin: 0 0 8px; color: var(--suave); text-transform: uppercase; letter-spacing: .6px; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
.topo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.topo .tit { font-size: 16px; font-weight: 700; }
.topo .sub { color: var(--suave); font-size: 12.5px; }
.btn { background: var(--painel); border: 1px solid var(--linha); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--azul); }
.btn.forte { background: #f2a33a; border-color: #f2a33a; color: #1b2638; font-weight: 700; }
.seg { display: inline-flex; background: var(--painel); border: 1px solid var(--linha); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 9px; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: var(--suave); }
.seg button.on { background: #f2a33a; color: #1b2638; font-weight: 700; }
.relogio { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
.relogio b { font-size: 18px; }
.relogio small { display: block; color: var(--suave); font-size: 11px; }
.grade { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 10px; align-items: start; }
@media (max-width: 900px) { .grade { grid-template-columns: 1fr; } }
.caixa { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 12px; margin-bottom: 10px; min-width: 0; }
.param { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; margin-bottom: 8px; }
.param label { font-size: 12.5px; }
.param output { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 12.5px; }
.param input[type=range] { grid-column: 1 / 3; accent-color: #f2a33a; width: 100%; }
.cab { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cab .ponto { width: 10px; height: 10px; border-radius: 50%; }
.cab b { font-size: 14px; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; cursor: pointer; margin-left: auto; }
details summary { cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--suave); }
.nota { color: var(--suave); font-size: 12px; margin: 6px 0 0; }
canvas { display: block; width: 100%; }
#planta { height: 360px; border-radius: 8px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 700px) { .kpis { grid-template-columns: 1fr; } }
.kpi { border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; background: var(--chip); }
.kpi h3 { margin: 0 0 6px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.kpi table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.kpi td { padding: 2px 0; }
.kpi td:last-child { text-align: right; font-weight: 700; }
.kpi .grande td:last-child { font-size: 18px; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--suave); margin-top: 6px; }
.leg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }
#grafico { height: 190px; }
#ocupacao { height: 170px; }
.duas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 1000px) { .duas { grid-template-columns: 1fr; } }
&lt;/style&gt;

&lt;body&gt;
&lt;div class=&quot;topo&quot;&gt;
  &lt;div&gt;&lt;div class=&quot;tit&quot;&gt;Operação completa&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;As duas linhas e as 40 estações com PTL · volumes entrando, transferências, separação e recirculação&lt;/div&gt;&lt;/div&gt;
  &lt;button class=&quot;btn forte&quot; id=&quot;btnPlay&quot;&gt;Pausar&lt;/button&gt;
  &lt;button class=&quot;btn&quot; id=&quot;btnReset&quot;&gt;Reiniciar&lt;/button&gt;
  &lt;span class=&quot;seg&quot; id=&quot;selVel&quot; role=&quot;group&quot; aria-label=&quot;Velocidade&quot;&gt;
    &lt;button data-v=&quot;1&quot;&gt;1×&lt;/button&gt;&lt;button data-v=&quot;10&quot; class=&quot;on&quot;&gt;10×&lt;/button&gt;&lt;button data-v=&quot;60&quot;&gt;60×&lt;/button&gt;&lt;button data-v=&quot;300&quot;&gt;300×&lt;/button&gt;
  &lt;/span&gt;
  &lt;button class=&quot;btn&quot; id=&quot;btnTurno&quot;&gt;Simular turno de 8 h&lt;/button&gt;
  &lt;div class=&quot;relogio&quot;&gt;&lt;b id=&quot;relogio&quot;&gt;00:00:00&lt;/b&gt;&lt;small&gt;tempo simulado&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;grade&quot;&gt;
  &lt;div&gt;
    &lt;section class=&quot;caixa&quot; id=&quot;pM&quot;&gt;&lt;/section&gt;
    &lt;section class=&quot;caixa&quot; id=&quot;pP&quot;&gt;&lt;/section&gt;
    &lt;section class=&quot;caixa&quot;&gt;
      &lt;h2&gt;Comum às duas linhas&lt;/h2&gt;
      &lt;div class=&quot;param&quot;&gt;&lt;label for=&quot;modo&quot;&gt;Modo de separação&lt;/label&gt;&lt;span&gt;&lt;/span&gt;
        &lt;select id=&quot;modo&quot; class=&quot;btn&quot; style=&quot;grid-column:1/3&quot;&gt;&lt;option value=&quot;ptl&quot;&gt;Com PTL (displays acendem)&lt;/option&gt;&lt;option value=&quot;manual&quot;&gt;Sem PTL (procura o endereço na tela)&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
      &lt;div class=&quot;param&quot;&gt;&lt;label for=&quot;pAlto&quot;&gt;Itens no alto giro&lt;/label&gt;&lt;output id=&quot;opAlto&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;pAlto&quot; min=&quot;30&quot; max=&quot;95&quot; step=&quot;1&quot;&gt;&lt;/div&gt;
      &lt;details&gt;
        &lt;summary&gt;Premissas de tempo e esteira&lt;/summary&gt;
        &lt;div style=&quot;margin-top:8px&quot;&gt;
          &lt;div class=&quot;param&quot;&gt;&lt;label for=&quot;vEst&quot;&gt;Velocidade da esteira (m/s)&lt;/label&gt;&lt;output id=&quot;ovEst&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;vEst&quot; min=&quot;0.2&quot; max=&quot;1&quot; step=&quot;0.05&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;param&quot;&gt;&lt;label for=&quot;tAlto&quot;&gt;Pega no alto giro 0-3 (s)&lt;/label&gt;&lt;output id=&quot;otAlto&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;tAlto&quot; min=&quot;1&quot; max=&quot;10&quot; step=&quot;0.5&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;param&quot;&gt;&lt;label for=&quot;t45&quot;&gt;Pega nos andares 4-5 (s)&lt;/label&gt;&lt;output id=&quot;ot45&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;t45&quot; min=&quot;2&quot; max=&quot;15&quot; step=&quot;0.5&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;param&quot;&gt;&lt;label for=&quot;tBaixo&quot;&gt;Pega no baixo giro, com deslocamento (s)&lt;/label&gt;&lt;output id=&quot;otBaixo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;tBaixo&quot; min=&quot;3&quot; max=&quot;25&quot; step=&quot;0.5&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;param&quot;&gt;&lt;label for=&quot;tUni&quot;&gt;Por unidade a mais (s)&lt;/label&gt;&lt;output id=&quot;otUni&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;tUni&quot; min=&quot;0.2&quot; max=&quot;2&quot; step=&quot;0.1&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;param&quot;&gt;&lt;label for=&quot;tCaixa&quot;&gt;Abrir, fechar e empurrar a caixa (s)&lt;/label&gt;&lt;output id=&quot;otCaixa&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;tCaixa&quot; min=&quot;2&quot; max=&quot;20&quot; step=&quot;1&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;param&quot;&gt;&lt;label for=&quot;tProc&quot;&gt;Procura sem PTL, por item (s)&lt;/label&gt;&lt;output id=&quot;otProc&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;tProc&quot; min=&quot;0&quot; max=&quot;15&quot; step=&quot;0.5&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;param&quot;&gt;&lt;label for=&quot;fila&quot;&gt;Caixas na esteira de separação por estação&lt;/label&gt;&lt;output id=&quot;ofila&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;fila&quot; min=&quot;1&quot; max=&quot;4&quot; step=&quot;1&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;
      &lt;button class=&quot;btn&quot; id=&quot;btnCap&quot; style=&quot;width:100%;margin-top:4px&quot;&gt;Calcular capacidade máxima (com e sem PTL)&lt;/button&gt;
      &lt;div id=&quot;cap&quot; class=&quot;nota&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;nota&quot;&gt;Valores iniciais são premissas: ~3.000 volumes/dia e 250 a 270 mil produtos/dia em 2 turnos. Ajuste com os dados reais da operação.&lt;/p&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;div&gt;
    &lt;section class=&quot;caixa&quot;&gt;
      &lt;h2&gt;Planta das esteiras&lt;/h2&gt;
      &lt;canvas id=&quot;planta&quot; role=&quot;img&quot; aria-label=&quot;Planta animada das duas linhas com as estações, as transferências e as caixas&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;leg&quot;&gt;
        &lt;span&gt;&lt;i style=&quot;background:#2E9E4F&quot;&gt;&lt;/i&gt;Caixa (volume)&lt;/span&gt;
        &lt;span&gt;&lt;i style=&quot;background:#e8eef6;border:1px solid #9aa6b8&quot;&gt;&lt;/i&gt;Estação ociosa&lt;/span&gt;

&lt;script&gt;

[&quot;Perfumaria&quot;,35,15,131]};
  // DADOS-FIM

  const P = {

  Object.values(LINHAS).forEach((L) =&gt; {

  // sorteio de itens: % no alto giro (P.pAlto); dentro de cada área, proporcional ao número de endereços da estação

  const geom = (media) =&gt; { let u = 1; const p = 1 / Math.max(1, media); while (Math.random() &gt; p &amp;&amp; u &lt; 60) u++; return u; };
  function novoVolume(L) {

  function tempoSeparacao(alvo) {

  }

  }
  function renderKPIs() {
    const k = { M: indicadores(&#x27;M&#x27;), P: indicadores(&#x27;P&#x27;) };
    const card = (titulo, cor, x) =&gt; `&lt;div class=&quot;kpi&quot;&gt;&lt;h3&gt;&lt;span style=&quot;width:10px;height:10px;border-radius:50%;background:${cor};display:inline-block&quot;&gt;&lt;/span&gt;${titulo}&lt;/h3&gt;&lt;table&gt;
      &lt;tr class=&quot;grande&quot;&gt;&lt;td&gt;Volumes por hora&lt;/td&gt;&lt;td&gt;${fmt(x.vh)}&lt;/td&gt;&lt;/tr&gt;

      cx.strokeRect(X(0), y - hEsteira / 2, L.comp * s, hEsteira);
      cx.fillStyle = L.cor;
      cx.textAlign = &#x27;left&#x27;;
      cx.font = &#x27;700 12px system-ui, sans-serif&#x27;;
      cx.fillText(`${L.nome} · ${L.esteira}${P[L.id].on ? &#x27;&#x27; : &#x27; (desligada)&#x27;}`, X(0), lado &lt; 0 ? y - hEsteira / 2 - hEst - 14 : y + hEsteira / 2 + hEst + 24);
      // estações
      L.est.forEach((e) =&gt; {
        const ox = X(e.x - PASSO / 2) + 1, oy = lado &lt; 0 ? y - hEsteira / 2 - 6 - hEst : y + hEsteira / 2 + 6;
        const o = T &gt; 0 ? e.ocupado / T : 0;
        cx.fillStyle = corOcup(o);
        cx.strokeStyle = &#x27;#9aa6b8&#x27;;
        cx.fillRect(ox, oy, PASSO * s - 2, hEst);
        cx.strokeRect(ox, oy, PASSO * s - 2, hEst);
        cx.fillStyle = &#x27;#1b2638&#x27;;
        cx.textAlign = &#x27;center&#x27;;
        cx.font = &#x27;700 11px system-ui, sans-serif&#x27;;
        cx.fillText(e.rua, X(e.x), oy + 13);
        // operador
        cx.beginPath();
        cx.arc(X(e.x) - 6, oy + hEst - 12, 4.5, 0, Math.PI * 2);
        cx.fillStyle = e.atual ? &#x27;#2E9E4F&#x27; : &#x27;#9aa6b8&#x27;;
        cx.fill();
        const nf = e.fila.length + e.chegando;
        if (nf) { cx.fillStyle = &#x27;#1b2638&#x27;; cx.font = &#x27;700 11px system-ui, sans-serif&#x27;; cx.fillText(String(nf), X(e.x) + 7, oy + hEst - 8); }
      });
      // transferências
      L.transf.forEach((t) =&gt; {
        cx.fillStyle = &#x27;#2e8b57&#x27;;
        cx.fillRect(X(t.x) - 3, y - hEsteira / 2 - 5, 6, 5);
        cx.fillRect(X(t.x) - 3, y + hEsteira / 2, 6, 5);
      });
      // caixas
      vols.forEach((v) =&gt; {
        if (v.L !== L || v.est === &#x27;X&#x27;) return;
        let px, py;
        if (v.est === &#x27;T&#x27;) { px = X(v.x); py = y; }
        else if (v.est === &#x27;R&#x27;) { const f = 1 - Math.max(0, v.delay) / (LOOP / P.vEst); px = X(L.comp) - f * (X(L.comp) - X(0)); py = yr; }
        else if (v.est === &#x27;D&#x27;) { px = X(v.para.x); py = y + lado * (hEsteira / 2 + 3); }
        else return;
        cx.fillStyle = &#x27;#2E9E4F&#x27;;
        cx.fillRect(px - 3.5, py - 3.5, 7, 7);
      });
      L.est.forEach((e) =&gt; {   // caixa sendo separada
        if (!e.atual) return;
        const oy = lado &lt; 0 ? y - hEsteira / 2 - 6 - hEst : y + hEsteira / 2 + 6;
        cx.fillStyle = &#x27;#2E9E4F&#x27;;
        cx.fillRect(X(e.x) + 2, oy + hEst / 2 - 9, 9, 9);
      });
    });
    cx.fillStyle = suave;
    cx.textAlign = &#x27;center&#x27;;
    cx.font = &#x27;11px system-ui, sans-serif&#x27;;
    cx.fillText(&#x27;linha tracejada = retorno da caixa que não conseguiu entrar na estação (recirculação)&#x27;, w / 2, h * 0.5 + 4);
  }

  // ------------------------------------------------------------------ gráficos
  function grafico() {
    const c = $(&#x27;#grafico&#x27;), g = c.getContext(&#x27;2d&#x27;), [w, h, d] = ajustar(c);
    g.setTransform(d, 0, 0, d, 0, 0);
    g.clearRect(0, 0, w, h);
    const suave = css(&#x27;--suave&#x27;), linha = css(&#x27;--linha&#x27;);
    const ml = 40, mb = 20, mt = 8, mr = 8;
    const maxV = Math.max(50, ...serie.map((p) =&gt; Math.max(p.M, p.P)), P.M.vph, P.P.vph) * 1.15;
    const tMax = Math.max(3600, T);
    g.font = &#x27;10.5px system-ui, sans-serif&#x27;;
    g.fillStyle = suave;
    g.strokeStyle = linha;
    g.textAlign = &#x27;right&#x27;;
    for (let i = 0; i &lt;= 4; i++) {
      const v = (maxV * i) / 4, yy = h - mb - ((h - mb - mt) * i) / 4;
      g.beginPath(); g.moveTo(ml, yy); g.lineTo(w - mr, yy); g.stroke();
      g.fillText(fmt(v), ml - 4, yy + 3);
    }
    g.textAlign = &#x27;center&#x27;;
    for (let hh = 0; hh &lt;= tMax / 3600; hh += Math.max(1, Math.round(tMax / 3600 / 8))) {
      g.fillText(hh + &#x27; h&#x27;, ml + ((w - ml - mr) * hh * 3600) / tMax, h - 5);
    }
    [[&#x27;M&#x27;, LINHAS.M.cor], [&#x27;P&#x27;, LINHAS.P.cor]].forEach(([k, cor]) =&gt; {
      // meta: volumes que entram por hora (tracejado)
      g.strokeStyle = cor;
      g.setLineDash([3, 4]);
      const ym = h - mb - ((h - mb - mt) * P[k].vph) / maxV;
      g.beginPath(); g.moveTo(ml, ym); g.lineTo(w - mr, ym); g.stroke();
      g.setLineDash([]);
      g.lineWidth = 2;
      g.beginPath();
      serie.forEach((p, i) =&gt; {
        const xx = ml + ((w - ml - mr) * p.t) / tMax, yy = h - mb - ((h - mb - mt) * p[k]) / maxV;
        if (i) g.lineTo(xx, yy); else g.moveTo(xx, yy);
      });
      g.stroke();
      g.lineWidth = 1;
    });
    g.textAlign = &#x27;left&#x27;;
    g.fillStyle = suave;
    g.fillText(&#x27;tracejado = volumes que entram por hora&#x27;, ml + 6, mt + 10);
  }
  function ocupacao() {
    const c = $(&#x27;#ocupacao&#x27;), g = c.getContext(&#x27;2d&#x27;), [w, h, d] = ajustar(c);
    g.setTransform(d, 0, 0, d, 0, 0);
    g.clearRect(0, 0, w, h);
    const suave = css(&#x27;--suave&#x27;), linha = css(&#x27;--linha&#x27;);
    const est = LINHAS.M.est.concat(LINHAS.P.est);
    const ml = 30, mb = 18, mt = 6, bw = (w - ml - 4) / est.length;
    g.strokeStyle = linha;
    g.fillStyle = suave;
    g.font = &#x27;10px system-ui, sans-serif&#x27;;
    g.textAlign = &#x27;right&#x27;;
    [0, 50, 100].forEach((p) =&gt; { const yy = h - mb - ((h - mb - mt) * p) / 100; g.beginPath(); g.moveTo(ml, yy); g.lineTo(w, yy); g.stroke(); g.fillText(p + &#x27;%&#x27;, ml - 3, yy + 3); });
    est.forEach((e, i) =&gt; {
      const o = T &gt; 0 ? e.ocupado / T : 0;
      const hh = (h - mb - mt) * Math.min(1, o);
      g.fillStyle = corOcup(o);
      g.fillRect(ml + i * bw + 1, h - mb - hh, bw - 2, hh);
      if (i % 2 === 0 || bw &gt; 18) { g.fillStyle = suave; g.textAlign = &#x27;center&#x27;; g.fillText(e.rua, ml + i * bw + bw / 2, h - 5); }
    });
  }

  // ------------------------------------------------------------------ controles
  function painelLinha(id) {
    const L = LINHAS[id], el = $(&#x27;#p&#x27; + id);
    el.innerHTML = `&lt;div class=&quot;cab&quot;&gt;&lt;span class=&quot;ponto&quot; style=&quot;background:${L.cor}&quot;&gt;&lt;/span&gt;&lt;b&gt;${L.nome}&lt;/b&gt;&lt;span class=&quot;sub&quot; style=&quot;color:var(--suave);font-size:12px;white-space:nowrap&quot;&gt;${L.esteira} · ${L.n} estações&lt;/span&gt;
      &lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;on&quot; ${P[id].on ? &#x27;checked&#x27; : &#x27;&#x27;}&gt; ligada&lt;/label&gt;&lt;/div&gt;
      &lt;div class=&quot;param&quot;&gt;&lt;label&gt;Volumes que entram por hora&lt;/label&gt;&lt;output data-o=&quot;vph&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; data-k=&quot;vph&quot; min=&quot;0&quot; max=&quot;600&quot; step=&quot;5&quot; value=&quot;${P[id].vph}&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;param&quot;&gt;&lt;label&gt;Itens por volume (média)&lt;/label&gt;&lt;output data-o=&quot;itens&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; data-k=&quot;itens&quot; min=&quot;1&quot; max=&quot;60&quot; step=&quot;1&quot; value=&quot;${P[id].itens}&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;param&quot;&gt;&lt;label&gt;Unidades por item (média)&lt;/label&gt;&lt;output data-o=&quot;unid&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; data-k=&quot;unid&quot; min=&quot;1&quot; max=&quot;12&quot; step=&quot;0.5&quot; value=&quot;${P[id].unid}&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;nota&quot;&gt;${L.n} operadores (1 por estação). Produtos por volume ≈ &lt;b data-o=&quot;prod&quot;&gt;&lt;/b&gt;.&lt;/p&gt;`;
    const at = () =&gt; {
      el.querySelectorAll(&#x27;[data-o]&#x27;).forEach((o) =&gt; {
        const k = o.dataset.o;
        o.textContent = k === &#x27;prod&#x27; ? fmt(P[id].itens * P[id].unid) : fmt(P[id][k], k === &#x27;unid&#x27; ? 1 : 0);
      });
    };
    el.addEventListener(&#x27;input&#x27;, (ev) =&gt; {
      const k = ev.target.dataset.k;
      if (!k) return;
      P[id][k] = ev.target.type === &#x27;checkbox&#x27; ? ev.target.checked : +ev.target.value;
      at();
    });
    at();
  }
  painelLinha(&#x27;M&#x27;);
  painelLinha(&#x27;P&#x27;);
  const comuns = { pAlto: [0, &#x27;%&#x27;], vEst: [2, &#x27;&#x27;], tAlto: [1, &#x27; s&#x27;], t45: [1, &#x27; s&#x27;], tBaixo: [1, &#x27; s&#x27;], tUni: [1, &#x27; s&#x27;], tCaixa: [0, &#x27; s&#x27;], tProc: [1, &#x27; s&#x27;], fila: [0, &#x27;&#x27;] };
  Object.entries(comuns).forEach(([k, [dec, un]]) =&gt; {
    const i = $(&#x27;#&#x27; + k), o = $(&#x27;#o&#x27; + k);
    i.value = P[k];
    const at = () =&gt; { P[k] = +i.value; o.textContent = fmt(P[k], dec) + un; };
    i.addEventListener(&#x27;input&#x27;, at);
    at();
  });
  $(&#x27;#modo&#x27;).addEventListener(&#x27;change&#x27;, (e) =&gt; { P.modo = e.target.value; });
  $(&#x27;#btnPlay&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { rodando = !rodando; $(&#x27;#btnPlay&#x27;).textContent = rodando ? &#x27;Pausar&#x27; : &#x27;Continuar&#x27;; });
  $(&#x27;#btnReset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { reiniciar(); tudo(); });
  $(&#x27;#selVel&#x27;).addEventListener(&#x27;click&#x27;, (e) =&gt; {
    const b = e.target.closest(&#x27;button&#x27;);
    if (!b) return;
    vel = +b.dataset.v;
    $(&#x27;#selVel&#x27;).querySelectorAll(&#x27;button&#x27;).forEach((x) =&gt; x.classList.toggle(&#x27;on&#x27;, x === b));
  });
  $(&#x27;#btnTurno&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const b = $(&#x27;#btnTurno&#x27;);
    b.disabled = true;
    b.textContent = &#x27;Simulando…&#x27;;
    setTimeout(() =&gt; {
      reiniciar();
      while (T &lt; 8 * 3600) passo(0.5);
      tudo();
      b.disabled = false;
      b.textContent = &#x27;Simular turno de 8 h&#x27;;
      rodando = false;
      $(&#x27;#btnPlay&#x27;).textContent = &#x27;Continuar&#x27;;
    }, 30);
  });
  // capacidade: maior entrada de volumes/h que a linha ainda escoa (&gt;= 97% concluído nas horas 2 e 3, sem fila crescendo)
  function escoa(id, vph) {
    const L = LINHAS[id];
    P[id].vph = vph;
    reiniciar();
    let ent = 0;
    while (T &lt; 3 * 3600) { passo(1); if (T &gt; 3600) ent += (vph * 1) / 3600; }
    const feitos = conc[id].filter((t) =&gt; t &gt; 3600).length;
    const naLinha = vols.filter((v) =&gt; v.L === L &amp;&amp; v.est !== &#x27;X&#x27;).length;
    return feitos &gt;= 0.97 * ent &amp;&amp; naLinha &lt; Math.max(30, vph * 0.35);
  }
  function capacidade(id, modo) {
    const guarda = JSON.stringify(P), outro = id === &#x27;M&#x27; ? &#x27;P&#x27; : &#x27;M&#x27;;
    P[outro].on = false; P[id].on = true; P.modo = modo;
    let lo = 20, hi = 1000;
    while (hi - lo &gt; 10) { const m = Math.round((lo + hi) / 2); if (escoa(id, m)) lo = m; else hi = m; }
    const r = { vph: lo, ih: lo * P[id].itens };
    Object.assign(P, JSON.parse(guarda));
    P.M = JSON.parse(guarda).M; P.P = JSON.parse(guarda).P;
    return r;
  }
  $(&#x27;#btnCap&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const b = $(&#x27;#btnCap&#x27;), out = $(&#x27;#cap&#x27;);
    b.disabled = true;
    out.textContent = &#x27;Calculando… (a simulação atual será reiniciada)&#x27;;
    setTimeout(() =&gt; {
      const t0 = performance.now();
      const r = {};
      [&#x27;M&#x27;, &#x27;P&#x27;].forEach((id) =&gt; { r[id] = { ptl: capacidade(id, &#x27;ptl&#x27;), manual: capacidade(id, &#x27;manual&#x27;) }; });
      reiniciar();
      const lin = (id) =&gt; {
        const x = r[id], g = x.manual.vph ? (x.ptl.vph / x.manual.vph - 1) * 100 : 0;
        return `&lt;b&gt;${LINHAS[id].nome}&lt;/b&gt;: até &lt;b&gt;${fmt(x.ptl.vph)}&lt;/b&gt; volumes/h com PTL (${fmt(x.ptl.ih / LINHAS[id].n)} itens/h por operador) e ${fmt(x.manual.vph)} sem PTL, &lt;b&gt;${g &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${fmt(g)}%&lt;/b&gt;.`;
      };
      out.innerHTML = `${lin(&#x27;M&#x27;)}&lt;br&gt;${lin(&#x27;P&#x27;)}&lt;br&gt;Com os itens por volume e as premissas atuais. Calculado em ${fmt((performance.now() - t0) / 1000, 1)} s.`;
      window.PTL_OP.capacidade = r;
      b.disabled = false;
      tudo();
    }, 30);
  });
  function tudo() { desenhar(); renderKPIs(); grafico(); ocupacao(); }

  // ------------------------------------------------------------------ laço
  let tAnt = performance.now(), uiT = 0, visivel = window.parent === window;
  if (!visivel) window.parent.postMessage({ ptlFilho: true, tipo: &#x27;pronto&#x27; }, &#x27;*&#x27;);
  // dentro do simulador unificado: só avança quando a aba &quot;Operação completa&quot; está aberta
  window.addEventListener(&#x27;message&#x27;, (e) =&gt; { const d = e.data || {}; if (d.ptlPai &amp;&amp; d.tipo === &#x27;visivel&#x27;) visivel = !!d.valor; });
  function laco(agora) {
    requestAnimationFrame(laco);
    const real = Math.min(0.25, (agora - tAnt) / 1000);
    tAnt = agora;
    if (rodando &amp;&amp; visivel &amp;&amp; !document.hidden) {
      let falta = real * vel;
      while (falta &gt; 0) { const dt = Math.min(0.5, falta); passo(dt); falta -= dt; }
    }
    desenhar();
    uiT += real;
    if (uiT &gt; 0.4) { uiT = 0; renderKPIs(); grafico(); ocupacao(); }
  }
  window.addEventListener(&#x27;resize&#x27;, tudo);
  window.PTL_OP = { P, LINHAS, passo, reiniciar, indicadores, T: () =&gt; T };
  requestAnimationFrame(laco);
})();
&lt;/script&gt;

"></iframe>
  <button id="pipRot" type="button">Estação 3D · ampliar</button>
</main>
<script>
(() => {
  const f3d = document.getElementById('f3d'), fcom = document.getElementById('fcom'), fctl = document.getElementById('fctl'), fop = document.getElementById('fop');
  const DICAS = { op: 'As duas linhas e as 40 estações: volumes por hora, produtividade e capacidade.' };
  const dicaPadrao = document.getElementById('dica').textContent;
  const para3d = (m) => { try { f3d.contentWindow.postMessage(Object.assign({ ptlPai: true }, m), '*'); } catch (e) { /* ainda carregando */ } };
  const paraCom = (m) => { try { fcom.contentWindow.postMessage(m, '*'); } catch (e) { /* ainda carregando */ } };
  const paraCtl = (m) => { try { fctl.contentWindow.postMessage(m, '*'); } catch (e) { /* ainda carregando */ } };
  const DO_CONTROLE = ['falhar', 'cad_iniciar', 'cad_apertar', 'cad_cancelar', 'identificar', 'localizar', 'pedirRegistro'];
  let modo = window.innerWidth >= 1100 ? 'lado' : '3d';
  try { const salvo = localStorage.getItem('ptl-modo'); if (salvo) modo = salvo; } catch (e) { /* sem armazenamento */ }
  function aplicar(m) {
    modo = m;
    document.body.className = 'modo-' + m;
    document.getElementById('dica').textContent = DICAS[m] || dicaPadrao;
    if (m === 'op' && !fop.getAttribute('src') && !fop.srcdoc) fop.setAttribute('src', fop.dataset.src);   // só carrega quando abrir a aba
    try { fop.contentWindow.postMessage({ ptlPai: true, tipo: 'visivel', valor: m === 'op' }, '*'); } catch (e) { /* ainda carregando */ }
    document.querySelectorAll('.abas button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
    para3d({ tipo: 'compacto', valor: m !== '3d' });
    para3d({ tipo: 'pip', valor: m === 'com' });
    paraCom({ ptlPai: true, tipo: 'visivel', valor: m === 'com' || m === 'lado' });
    try { localStorage.setItem('ptl-modo', m); } catch (e) { /* sem armazenamento */ }
    setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
  }
  document.querySelectorAll('.abas button').forEach((b) => b.addEventListener('click', () => aplicar(b.dataset.m)));
  document.getElementById('pipRot').addEventListener('click', () => aplicar('3d'));
  window.addEventListener('keydown', (e) => {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    const m = { Digit1: '3d', Digit2: 'com', Digit3: 'lado', Digit4: 'ctl', Digit5: 'op' }[e.code];
    if (m) aplicar(m);
  });
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (e.source === f3d.contentWindow && d.ptl) { paraCom(d); paraCtl(d); }
    if (e.source === fcom.contentWindow && d.ptlFilho) {
      if (d.tipo === 'pronto') { para3d({ tipo: 'pedirMapa' }); aplicar(modo); }
      if (d.tipo === 'gatilho' || d.tipo === 'apertar' || d.tipo === 'rede') para3d(d);
    }
    if (e.source === fop.contentWindow && d.ptlFilho && d.tipo === 'pronto') fop.contentWindow.postMessage({ ptlPai: true, tipo: 'visivel', valor: modo === 'op' }, '*');
    if (e.source === fctl.contentWindow && d.ptlFilho) {
      if (d.tipo === 'pronto') para3d({ tipo: 'pedirMapa' });
      if (DO_CONTROLE.includes(d.tipo)) para3d(d);
    }
  });
  f3d.addEventListener('load', () => { aplicar(modo); para3d({ tipo: 'pedirMapa' }); });
  aplicar(modo);
})();
</script>
