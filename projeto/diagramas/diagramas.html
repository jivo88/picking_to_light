<text x='520' y='450' font-size='12.5' font-family='Segoe UI, Arial, sans-serif'>• 160 endereços (andares 0-7) em 6 zonas; 1 display E+Q por zona mostra o endereço e a quantidade do próximo item da rota.</text>
<text x='520' y='472' font-size='12.5' font-family='Segoe UI, Arial, sans-serif'>• Prédio 015 (3-4 posições) entra na Zona 1. Todas as zonas com itens trabalham ao mesmo tempo; o operador confirma no botão da zona.</text>
<text x='520' y='494' font-size='12.5' font-family='Segoe UI, Arial, sans-serif'>• Opcional: LED guia no topo de cada prédio indica a coluna do item da zona.</text>
