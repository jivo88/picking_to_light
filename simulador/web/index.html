<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador Pick-to-Light</title>
<style>
  :root {
    --fundo: #eef1f5;
    --painel: #ffffff;
    --borda: #dfe4ea;
    --texto: #1c2430;
    --suave: #5b6675;
    --azul: #2563eb;
    --verde: #16a34a;
    --ambar: #d97706;
    --vermelho: #dc2626;
    --grade: #e6eaf0;
    --console: #0f172a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px;
    background: #111827; color: #f3f4f6;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: #9ca3af; font-size: 13px; }
  header .espaco { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: #1f2937; color: #e5e7eb; border: 1px solid #374151;
  }
  .pill .ponto { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
  .pill.ok .ponto { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .pill.meio .ponto { background: #f59e0b; }
  .pill.ruim .ponto { background: #ef4444; }

  .fluxo {
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 24px; background: #fff; border-bottom: 1px solid var(--borda);
    color: var(--suave); font-size: 13px;
  }
  .fluxo b { color: var(--texto); }
  .fluxo .seta { color: #94a3b8; }

  main {
    display: grid; gap: 18px; padding: 18px 24px 28px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .painel {
    background: var(--painel); border: 1px solid var(--borda); border-radius: 12px;
    box-shadow: 0 1px 2px rgba(16,24,40,.05);
    display: flex; flex-direction: column; min-width: 0;
  }
  .painel.largo { grid-column: 1 / -1; }
  .cab {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--borda);
  }
  .cab h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .cab .dica { color: var(--suave); font-size: 12.5px; flex: 1; min-width: 200px; }
  .cab .pill { background: #f3f4f6; color: #374151; border-color: #e5e7eb; }
  .erro {
    display: none; margin: 10px 16px 0; padding: 8px 12px; border-radius: 8px;
    background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; font-size: 13px;
  }
  .circuito {
    padding: 8px;
    background-color: #fbfcfd;
    background-image: radial-gradient(var(--grade) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  .circuito svg { width: 100%; height: auto; display: block; user-select: none; }
  .botao { cursor: pointer; }
  .botao:hover .tampa { filter: brightness(1.08); }

  .serial { border-top: 1px solid var(--borda); }
  .serial summary {
    cursor: pointer; padding: 8px 16px; font-size: 12.5px; color: var(--suave);
    font-weight: 600; list-style: none;
  }
  .serial summary::-webkit-details-marker { display: none; }
  .serial summary::before { content: "▸ "; }
  .serial[open] summary::before { content: "▾ "; }
  .console {
    height: 170px; overflow-y: auto; margin: 0 12px; padding: 8px 10px;
    background: var(--console); color: #cbd5e1; border-radius: 8px;
    font: 12px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .console .env { color: #93c5fd; }
  .console .rec { color: #86efac; }
  .console .lcd { color: #d8b4fe; }
  .console .err { color: #fca5a5; }
  .console .dest { color: #fde68a; font-weight: 600; }
  .entrada { display: flex; gap: 8px; padding: 8px 12px 12px; }
  .entrada input {
    flex: 1; padding: 7px 10px; border: 1px solid var(--borda); border-radius: 8px;
    font: 13px ui-monospace, Consolas, monospace;
  }
  .entrada button {
    padding: 7px 14px; border: 0; border-radius: 8px; background: var(--azul); color: #fff;
    font-weight: 600; cursor: pointer;
  }

  .trafego { max-height: 260px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid #f0f2f5; vertical-align: top; }
  th { position: sticky; top: 0; background: #f8fafc; color: var(--suave); font-weight: 600; }
  td.msg { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #334155; word-break: break-word; }
  td.top { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #0f766e; white-space: nowrap; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .tag.leitor { background: #fef3c7; color: #92400e; }
  .tag.est { background: #dbeafe; color: #1e40af; }
  .tag.conc { background: #dcfce7; color: #166534; }

  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Simulador Pick-to-Light</h1>
  <span class="sub">local · mesmo código das placas · sem internet</span>
  <span class="espaco"></span>
  <span class="pill" id="pillBroker"><span class="ponto"></span><span>Broker MQTT</span></span>
  <span class="pill" id="pillMsgs"><span>0 mensagens</span></span>
</header>
<div class="fluxo">
  <b>Leitor de pulso</b> lê a etiqueta <span class="seta">→</span>
  <b>Estação</b> bipa a caixa <span class="seta">→</span>
  <b>Concentrador</b> acende os endereços <span class="seta">→</span>
  confirmações voltam pelo mesmo caminho
</div>
<main id="principal"></main>

<script>
"use strict";

// ---------------------------------------------------------------- dicas
const DICAS = {
  leitor: "Clique em LER (fica azul por 5 s) e depois numa etiqueta. Verde = caixa aceita · vermelho = recusada.",
  estacao: "Recebe a etiqueta do leitor. BIPAR CAIXA envia a próxima caixa de teste · CANCELA cancela.",
  concentrador: "Alto giro: todos os itens acendem juntos. Baixo giro: um endereço por vez — OK passa para o próximo. Clique = confirma · segure ~1 s = falta.",
};

// areas destacadas no desenho de cada placa (molduras com titulo)
const SECOES = {
  concentrador: [
    { titulo: "ALTO GIRO · flow rack com LED por endereço", prefixos: ["d", "px", "b"], excluir: ["dBG", "bBG"] },
    { titulo: "BAIXO GIRO · endereço + quantidade, um item por vez", ids: ["lcdBG", "dBG", "bBG", "ledBG", "rBG"] },
  ],
  leitor: [
    { titulo: "PULSEIRA", ids: ["btLer", "status", "ledVibra", "r1", "buzzer"] },
    { titulo: "ETIQUETAS NFC NAS CAIXAS (simuladas)", prefixos: ["tag"] },
  ],
  estacao: [
    { titulo: "ESTAÇÃO", ids: ["lcd", "btBip", "btCanc", "ledLivre", "ledSep", "r1", "r2"] },
  ],
};

function pecasDaSecao(secao, partes) {
  return partes.filter((p) => {
    if (secao.ids) return secao.ids.includes(p.id);
    if (secao.excluir && secao.excluir.includes(p.id)) return false;
    return secao.prefixos.some((pre) => p.id.startsWith(pre) && /^\D+\d+$/.test(p.id));
  });
}

// ---------------------------------------------------------------- utilidades SVG
const NS = "http://www.w3.org/2000/svg";
function el(nome, attrs = {}, pai = null) {
  const e = document.createElementNS(NS, nome);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (pai) pai.appendChild(e);
  return e;
}
function texto(pai, x, y, conteudo, attrs = {}) {
  const t = el("text", Object.assign({ x, y, "font-family": "system-ui, Segoe UI, sans-serif" }, attrs), pai);
  t.textContent = conteudo;
  return t;
}

const CORES_BOTAO = { green: "#22a34a", blue: "#2563eb", red: "#dc2626", yellow: "#eab308",
                      white: "#f1f5f9", black: "#1f2937", grey: "#9ca3af" };
const CORES_LED = { red: "#ef4444", green: "#22c55e", limegreen: "#32cd32", yellow: "#facc15",
                    orange: "#f97316", blue: "#3b82f6", white: "#f8fafc" };

// tamanho de cada peca (largura, altura) no desenho
const TAMANHOS = {
  "board-pi-pico-w": [70, 178], "wokwi-pi-pico": [70, 178],
  "wokwi-tm1637-7segment": [150, 52], "wokwi-neopixel": [26, 26],
  "wokwi-pushbutton": [56, 74], "wokwi-led": [24, 50], "wokwi-resistor": [60, 14],
  "wokwi-buzzer": [44, 44], "wokwi-lcd1602": [330, 110],
};

function tamanho(p) {
  let [w, h] = TAMANHOS[p.type] || [40, 40];
  if (p.rotate === 90 || p.rotate === 270) [w, h] = [h, w];
  return [w, h];
}

// ---------------------------------------------------------------- 7 segmentos
const SEGS = { "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd", "4": "fgbc", "5": "afgcd",
               "6": "afgedc", "7": "abc", "8": "abcdefg", "9": "abcdfg", "-": "g", " ": "" };
function digito(pai, x, y) {
  // retorna os 7 segmentos (a..g) de um digito de 20 x 34, em formato hexagonal
  const W = 20, H = 34, T = 4, F = 1.2;
  const xl = x + T / 2, xr = x + W - T / 2;
  const yt = y + T / 2, ym = y + H / 2, yb = y + H - T / 2;
  const hor = (x0, x1, yc) =>
    `${x0},${yc} ${x0+T/2},${yc-T/2} ${x1-T/2},${yc-T/2} ${x1},${yc} ${x1-T/2},${yc+T/2} ${x0+T/2},${yc+T/2}`;
  const ver = (xc, y0, y1) =>
    `${xc},${y0} ${xc+T/2},${y0+T/2} ${xc+T/2},${y1-T/2} ${xc},${y1} ${xc-T/2},${y1-T/2} ${xc-T/2},${y0+T/2}`;
  const s = {
    a: hor(xl + F, xr - F, yt),
    g: hor(xl + F, xr - F, ym),
    d: hor(xl + F, xr - F, yb),
    f: ver(xl, yt + F, ym - F),
    b: ver(xr, yt + F, ym - F),
    e: ver(xl, ym + F, yb - F),
    c: ver(xr, ym + F, yb - F),
  };
  const grupo = el("g", { transform: `translate(${0.09 * (y + H / 2)},0) skewX(-5)` }, pai);
  const r = {};
  for (const [k, pts] of Object.entries(s)) r[k] = el("polygon", { points: pts, fill: "#3a0d0d" }, grupo);
  return r;
}

// ---------------------------------------------------------------- desenho das pecas
function desenharPeca(g, p, gpio, placaId) {
  const [w, h] = TAMANHOS[p.type] || [40, 40];
  const a = p.attrs || {};
  const ref = { tipo: p.type };

  if (p.type === "board-pi-pico-w" || p.type === "wokwi-pi-pico") {
    el("rect", { x: 0, y: 0, width: w, height: h, rx: 6, fill: "#1f6f43", stroke: "#165533" }, g);
    el("rect", { x: w/2 - 12, y: -6, width: 24, height: 14, rx: 2, fill: "#b8bec7", stroke: "#8b929c" }, g);
    for (let i = 0; i < 20; i++) {
      el("circle", { cx: 6, cy: 14 + i * 8, r: 2.4, fill: "#d4a72c", stroke: "#a17d18" }, g);
      el("circle", { cx: w - 6, cy: 14 + i * 8, r: 2.4, fill: "#d4a72c", stroke: "#a17d18" }, g);
    }
    el("rect", { x: w/2 - 13, y: 64, width: 26, height: 26, rx: 2, fill: "#1f2937" }, g);
    texto(g, w/2, 80, "RP2040", { "font-size": 6.5, fill: "#9ca3af", "text-anchor": "middle" });
    if (p.type === "board-pi-pico-w") {
      el("rect", { x: w/2 - 16, y: 120, width: 32, height: 26, rx: 2, fill: "#c7ccd3", stroke: "#9aa1ab" }, g);
      texto(g, w/2, 136, "Wi-Fi", { "font-size": 7, fill: "#4b5563", "text-anchor": "middle" });
    }
    ref.led = el("circle", { cx: w/2 - 18, cy: 24, r: 3.5, fill: "#6b7280" }, g);
    texto(g, w/2 - 12, 27, "REDE", { "font-size": 6.5, fill: "#d1fae5" });
    texto(g, w/2, h + 14, p.type === "board-pi-pico-w" ? "Raspberry Pi Pico W" : "Raspberry Pi Pico",
          { "font-size": 10, fill: "#475569", "text-anchor": "middle" });
  }

  else if (p.type === "wokwi-tm1637-7segment") {
    el("rect", { x: 0, y: 0, width: w, height: h, rx: 4, fill: "#1e4f9a", stroke: "#163c75" }, g);
    el("rect", { x: 7, y: 6, width: w - 14, height: h - 12, rx: 2, fill: "#0b0b0b" }, g);
    ref.digitos = [];
    for (let i = 0; i < 4; i++) ref.digitos.push(digito(g, 16 + i * 32, 9));
    const gp = gpio(p.id + ":DIO");
    if (gp != null) texto(g, w - 2, h + 12, "DIO GP" + gp, { "font-size": 9, fill: "#94a3b8", "text-anchor": "end" });
  }

  else if (p.type === "wokwi-neopixel") {
    ref.brilho = el("circle", { cx: w/2, cy: h/2, r: 15, fill: "transparent", filter: `url(#brilho-${placaId})` }, g);
    el("rect", { x: 0, y: 0, width: w, height: h, rx: 4, fill: "#f8fafc", stroke: "#cbd5e1" }, g);
    ref.luz = el("circle", { cx: w/2, cy: h/2, r: 8, fill: "#2b2f36", stroke: "#94a3b8", "stroke-width": .8 }, g);
  }

  else if (p.type === "wokwi-pushbutton") {
    const cor = CORES_BOTAO[a.color] || CORES_BOTAO.green;
    const gp = gpio(p.id + ":1.l");
    const grupo = el("g", { class: "botao" }, g);
    el("rect", { x: 0, y: 0, width: 56, height: 56, rx: 8, fill: "#2b2f36", stroke: "#111827" }, grupo);
    for (const [cx, cy] of [[7,7],[49,7],[7,49],[49,49]]) el("circle", { cx, cy, r: 2.5, fill: "#4b5563" }, grupo);
    ref.tampa = el("circle", { class: "tampa", cx: 28, cy: 28, r: 17, fill: cor,
                               stroke: a.color === "white" ? "#cbd5e1" : "rgba(0,0,0,.25)", "stroke-width": 1.5 }, grupo);
    ref.brilhoTampa = el("ellipse", { cx: 23, cy: 22, rx: 7, ry: 4, fill: "rgba(255,255,255,.35)" }, grupo);
    if (a.label) texto(g, 28, 70, a.label, { "font-size": 11, "font-weight": 600, fill: "#1f2937", "text-anchor": "middle" });
    if (gp != null) texto(g, 28, 83, "GP" + gp, { "font-size": 9, fill: "#94a3b8", "text-anchor": "middle" });
    ref.gp = gp;
    ref.grupo = grupo;
    ref.cor = cor;
    ligarBotao(grupo, placaId, gp, ref);
  }

  else if (p.type === "wokwi-led") {
    const cor = CORES_LED[a.color] || CORES_LED.red;
    ref.brilho = el("circle", { cx: 12, cy: 12, r: 16, fill: "transparent", filter: `url(#brilho-${placaId})` }, g);
    el("line", { x1: 8, y1: 26, x2: 8, y2: 44, stroke: "#9ca3af", "stroke-width": 2 }, g);
    el("line", { x1: 16, y1: 26, x2: 16, y2: 40, stroke: "#9ca3af", "stroke-width": 2 }, g);
    ref.luz = el("path", { d: "M2,26 L2,12 A10,10 0 0 1 22,12 L22,26 Z", fill: cor, opacity: .28,
                           stroke: "rgba(0,0,0,.25)" }, g);
    ref.corLed = cor;
    if (a.label) texto(g, 12, 60, a.label, { "font-size": 10.5, "font-weight": 600, fill: "#1f2937", "text-anchor": "middle" });
  }

  else if (p.type === "wokwi-resistor") {
    const rot = p.rotate === 90 || p.rotate === 270;
    const corpo = el("g", rot ? { transform: `translate(14,0) rotate(90)` } : {}, g);
    el("line", { x1: 0, y1: 7, x2: 60, y2: 7, stroke: "#9ca3af", "stroke-width": 2 }, corpo);
    el("rect", { x: 14, y: 1, width: 32, height: 12, rx: 5, fill: "#e7d2a7", stroke: "#b59b6a" }, corpo);
    for (const [x, c] of [[20, "#dc2626"], [26, "#dc2626"], [32, "#78350f"], [40, "#d4a72c"]])
      el("rect", { x, y: 1, width: 3, height: 12, fill: c }, corpo);
  }

  else if (p.type === "wokwi-buzzer") {
    ref.anel = el("circle", { cx: 22, cy: 22, r: 26, fill: "none", stroke: "#f59e0b", "stroke-width": 3, opacity: 0 }, g);
    el("circle", { cx: 22, cy: 22, r: 21, fill: "#1f2937", stroke: "#0b1220" }, g);
    el("circle", { cx: 22, cy: 22, r: 13, fill: "none", stroke: "#374151", "stroke-width": 2 }, g);
    el("circle", { cx: 22, cy: 22, r: 3, fill: "#0b1220" }, g);
    ref.nota = texto(g, 46, 6, "♪", { "font-size": 16, fill: "#f59e0b", opacity: 0 });
    texto(g, 22, 58, "BUZZER", { "font-size": 9.5, "font-weight": 600, fill: "#475569", "text-anchor": "middle" });
  }

  else if (p.type === "wokwi-lcd1602") {
    el("rect", { x: 0, y: 0, width: w, height: h, rx: 6, fill: "#2f7d32", stroke: "#225c25" }, g);
    for (let i = 0; i < 4; i++) el("circle", { cx: [8, w-8][i % 2], cy: [8, h-8][i >> 1], r: 3.5, fill: "#d4d4d4" }, g);
    el("rect", { x: 14, y: 16, width: w - 28, height: h - 32, rx: 3, fill: "#1b2a12" }, g);
    ref.tela = el("rect", { x: 18, y: 20, width: w - 36, height: h - 40, rx: 2, fill: "#5d7f2e" }, g);
    ref.linhas = [];
    const cw = (w - 36) / 16;
    for (let l = 0; l < 2; l++) {
      for (let c = 0; c < 16; c++)
        el("rect", { x: 18 + c * cw + 1, y: 22 + l * 34 + 2, width: cw - 2, height: 28, fill: "rgba(0,0,0,.06)" }, g);
      const t = texto(g, 18 + cw / 2, 22 + l * 34 + 24, "", {
        "font-family": "ui-monospace, Consolas, monospace", "font-size": 22, fill: "#102007" });
      t.setAttribute("textLength", (w - 36 - cw).toFixed(1));
      t.setAttribute("lengthAdjust", "spacing");
      ref.linhas.push(t);
    }
    texto(g, w / 2, h + 14, "LCD 16x2 · I2C 0x27", { "font-size": 9.5, fill: "#94a3b8", "text-anchor": "middle" });
  }

  else {
    el("rect", { x: 0, y: 0, width: w, height: h, fill: "#e5e7eb", stroke: "#9ca3af" }, g);
    texto(g, 4, 14, p.type, { "font-size": 9, fill: "#374151" });
  }
  return ref;
}

// ---------------------------------------------------------------- botoes
function ligarBotao(grupo, placaId, gp, ref) {
  if (gp == null) return;
  let apertado = false;
  const mudar = (v) => {
    if (apertado === v) return;
    apertado = v;
    visualBotao(ref, v);
    fetch("/api/botao", { method: "POST", headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ placa: placaId, gp, apertado: v }) });
  };
  grupo.addEventListener("pointerdown", (e) => { grupo.setPointerCapture(e.pointerId); mudar(true); e.preventDefault(); });
  grupo.addEventListener("pointerup", () => mudar(false));
  grupo.addEventListener("pointercancel", () => mudar(false));
  grupo.addEventListener("lostpointercapture", () => mudar(false));
}
function visualBotao(ref, apertado) {
  ref.tampa.setAttribute("r", apertado ? 15 : 17);
  ref.tampa.style.filter = apertado ? "brightness(.8)" : "";
  ref.brilhoTampa.setAttribute("opacity", apertado ? .1 : 1);
}

// ---------------------------------------------------------------- montagem de cada placa
function mapearGpios(diagrama) {
  const pai = {};
  const achar = (x) => { if (!(x in pai)) pai[x] = x; while (pai[x] !== x) { pai[x] = pai[pai[x]]; x = pai[x]; } return x; };
  const unir = (a, b) => { pai[achar(a)] = achar(b); };
  for (const c of diagrama.connections || []) unir(c[0], c[1]);
  for (const p of diagrama.parts || []) if (p.type === "wokwi-resistor") unir(p.id + ":1", p.id + ":2");
  const gpDaRede = {};
  for (const no of Object.keys(pai)) if (no.startsWith("pico:GP")) gpDaRede[achar(no)] = parseInt(no.slice(7));
  return (pino) => (pino in pai ? gpDaRede[achar(pino)] : undefined);
}

const placas = {};
let brokerDesde = 0;

function criarPainel(info) {
  const painel = document.createElement("section");
  painel.className = "painel" + (info.id === "concentrador" ? " largo" : "");
  painel.innerHTML = `
    <div class="cab">
      <h2>${info.titulo}</h2>
      <span class="dica">${DICAS[info.id] || ""}</span>
      <span class="pill" data-rede="wifi"><span class="ponto"></span>Wi-Fi</span>
      <span class="pill" data-rede="mqtt"><span class="ponto"></span>MQTT</span>
    </div>
    <div class="erro"></div>
    <div class="circuito"></div>
    <details class="serial" ${info.id === "concentrador" ? "" : "open"}>
      <summary>Monitor Serial</summary>
      <div class="console"></div>
      <div class="entrada">
        <input placeholder="Digitar no Serial Monitor (ex.: C0001234, CAIXAS, CANCELA)" />
        <button>Enviar</button>
      </div>
    </details>`;
  document.getElementById("principal").appendChild(painel);

  // desenho
  const diagrama = info.diagrama;
  const gpio = mapearGpios(diagrama);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of diagrama.parts) {
    const [w, h] = tamanho(p);
    minX = Math.min(minX, p.left); minY = Math.min(minY, p.top);
    maxX = Math.max(maxX, p.left + w); maxY = Math.max(maxY, p.top + h + 18);
  }
  // molduras das areas (alto giro, baixo giro...)
  const molduras = [];
  for (const secao of SECOES[info.id] || []) {
    const ps = pecasDaSecao(secao, diagrama.parts);
    if (!ps.length) continue;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of ps) {
      const [w, h] = tamanho(p);
      x0 = Math.min(x0, p.left); y0 = Math.min(y0, p.top);
      x1 = Math.max(x1, p.left + w); y1 = Math.max(y1, p.top + h + 16);
    }
    const m = { titulo: secao.titulo, x0: x0 - 16, y0: y0 - 30, x1: x1 + 16, y1: y1 + 10 };
    molduras.push(m);
    minX = Math.min(minX, m.x0); minY = Math.min(minY, m.y0);
    maxX = Math.max(maxX, m.x1); maxY = Math.max(maxY, m.y1);
  }
  const PAD = 26;
  const larg = maxX - minX + PAD * 2, alt = maxY - minY + PAD * 2;
  const svg = el("svg", { viewBox: `0 0 ${larg} ${alt}` });
  svg.style.maxHeight = info.id === "concentrador" ? "720px" : "400px";
  const defs = el("defs", {}, svg);
  const f = el("filter", { id: `brilho-${info.id}`, x: "-60%", y: "-60%", width: "220%", height: "220%" }, defs);
  el("feGaussianBlur", { stdDeviation: 5 }, f);
  painel.querySelector(".circuito").appendChild(svg);

  for (const m of molduras) {
    const x = m.x0 - minX + PAD, y = m.y0 - minY + PAD;
    el("rect", { x, y, width: m.x1 - m.x0, height: m.y1 - m.y0, rx: 12,
                 fill: "rgba(255,255,255,.65)", stroke: "#cbd5e1", "stroke-dasharray": "6 5" }, svg);
    texto(svg, x + 14, y + 18, m.titulo, { "font-size": 11.5, "font-weight": 700, fill: "#475569",
                                           "letter-spacing": ".6" });
  }

  const refs = {};
  for (const p of diagrama.parts) {
    const x = p.left - minX + PAD, y = p.top - minY + PAD;
    const g = el("g", { transform: `translate(${x},${y})` }, svg);
    refs[p.id] = desenharPeca(g, p, gpio, info.id);
  }

  // serial
  const consoleEl = painel.querySelector(".console");
  const input = painel.querySelector(".entrada input");
  const enviar = () => {
    const t = input.value.trim();
    if (!t) return;
    fetch("/api/serial", { method: "POST", headers: { "Content-Type": "application/json" },
                           body: JSON.stringify({ placa: info.id, texto: t }) });
    input.value = "";
  };
  painel.querySelector(".entrada button").onclick = enviar;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") enviar(); });

  placas[info.id] = { info, painel, refs, consoleEl, logDesde: 0,
                      erroEl: painel.querySelector(".erro") };
}

// ---------------------------------------------------------------- atualizacao
function escala(c) {
  // deixa as cores do LED visiveis na tela (o codigo usa valores baixos)
  const m = Math.max(c[0], c[1], c[2]);
  if (!m) return null;
  const k = 255 / m;
  return `rgb(${Math.round(c[0]*k)},${Math.round(c[1]*k)},${Math.round(c[2]*k)})`;
}

function atualizarPlaca(id, est) {
  const pl = placas[id];
  if (!pl) return;
  for (const [nome, ok] of Object.entries(est.rede)) {
    const pill = pl.painel.querySelector(`[data-rede="${nome}"]`);
    pill.classList.toggle("ok", ok);
    pill.classList.toggle("ruim", !ok);
  }
  pl.erroEl.style.display = est.erro ? "block" : "none";
  pl.erroEl.textContent = est.erro ? "Erro na placa: " + est.erro : "";

  for (const [pid, ref] of Object.entries(pl.refs)) {
    const s = est.pecas[pid] || {};
    if (ref.tipo === "board-pi-pico-w" || ref.tipo === "wokwi-pi-pico") {
      ref.led.setAttribute("fill", est.rede.mqtt ? "#22c55e" : est.rede.wifi ? "#f59e0b" : "#ef4444");
    } else if (ref.tipo === "wokwi-tm1637-7segment") {
      const t = (s.texto || "").padStart(4, " ").slice(-4);
      for (let i = 0; i < 4; i++) {
        const lig = SEGS[t[i]] || "";
        for (const [seg, poly] of Object.entries(ref.digitos[i]))
          poly.setAttribute("fill", lig.includes(seg) ? "#ff3b2f" : "#3a0d0d");
      }
    } else if (ref.tipo === "wokwi-neopixel") {
      const cor = escala(s.cor || [0, 0, 0]);
      ref.luz.setAttribute("fill", cor || "#2b2f36");
      ref.brilho.setAttribute("fill", cor || "transparent");
      ref.brilho.setAttribute("opacity", cor ? .85 : 0);
    } else if (ref.tipo === "wokwi-led") {
      ref.luz.setAttribute("opacity", s.aceso ? 1 : .28);
      ref.brilho.setAttribute("fill", s.aceso ? ref.corLed : "transparent");
      ref.brilho.setAttribute("opacity", s.aceso ? .8 : 0);
    } else if (ref.tipo === "wokwi-buzzer") {
      ref.anel.setAttribute("opacity", s.tocando ? .9 : 0);
      ref.nota.setAttribute("opacity", s.tocando ? 1 : 0);
    } else if (ref.tipo === "wokwi-lcd1602") {
      const linhas = s.linhas || ["", ""];
      ref.tela.setAttribute("fill", s.luz ? "#8fc23a" : "#5d7f2e");
      for (let l = 0; l < 2; l++) ref.linhas[l].textContent = (linhas[l] || "").padEnd(16, " ").replace(/ /g, " ");
    }
  }

  if (est.log.length) {
    const noFim = pl.consoleEl.scrollTop + pl.consoleEl.clientHeight >= pl.consoleEl.scrollHeight - 30;
    for (const linha of est.log) {
      const d = document.createElement("div");
      if (linha.includes("-> rede")) d.className = "env";
      else if (linha.includes("<- ")) d.className = "rec";
      else if (linha.startsWith("[LCD]")) d.className = "lcd";
      else if (/ERRO|Falha|Sem resposta|recusou/i.test(linha)) d.className = "err";
      else if (linha.startsWith("==")) d.className = "dest";
      d.textContent = linha;
      pl.consoleEl.appendChild(d);
    }
    while (pl.consoleEl.childElementCount > 400) pl.consoleEl.firstChild.remove();
    if (noFim) pl.consoleEl.scrollTop = pl.consoleEl.scrollHeight;
  }
  pl.logDesde = est.log_total;
}

function nomeOrigem(id) {
  if (id.startsWith("ptl-leitor")) return '<span class="tag leitor">leitor</span>';
  if (id.startsWith("ptl-est")) return '<span class="tag est">estação</span>';
  if (id.startsWith("ptl-conc")) return '<span class="tag conc">concentrador</span>';
  return esc(id);
}
function esc(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

let tabela;
function atualizarBroker(b) {
  const pill = document.getElementById("pillBroker");
  pill.classList.toggle("ok", b.clientes >= 3);
  pill.classList.toggle("meio", b.clientes > 0 && b.clientes < 3);
  pill.lastElementChild.textContent = `Broker MQTT · ${b.clientes} conectada${b.clientes === 1 ? "" : "s"}`;
  document.getElementById("pillMsgs").firstElementChild.textContent = `${b.trafego_total} mensagens`;
  for (const m of b.trafego) {
    const tr = document.createElement("tr");
    const topico = m.topico.split("/").slice(1).join("/");
    tr.innerHTML = `<td>${m.hora}</td><td>${nomeOrigem(m.de)}</td><td class="top">${esc(topico)}</td><td class="msg">${esc(m.msg)}</td>`;
    tabela.prepend(tr);
  }
  while (tabela.childElementCount > 300) tabela.lastElementChild.remove();
  brokerDesde = b.trafego_total;
}

async function ciclo() {
  try {
    const q = new URLSearchParams({ broker: brokerDesde });
    for (const [id, pl] of Object.entries(placas)) q.set("log_" + id, pl.logDesde);
    const r = await fetch("/api/estado?" + q);
    const d = await r.json();
    for (const [id, est] of Object.entries(d.placas)) atualizarPlaca(id, est);
    atualizarBroker(d.broker);
  } catch (e) {
    document.getElementById("pillBroker").className = "pill ruim";
    document.getElementById("pillBroker").lastElementChild.textContent = "Simulador parado";
  }
  setTimeout(ciclo, 120);
}

async function iniciar() {
  const r = await fetch("/api/placas");
  const lista = await r.json();
  for (const info of lista) criarPainel(info);

  const painel = document.createElement("section");
  painel.className = "painel largo";
  painel.innerHTML = `
    <div class="cab"><h2>Tráfego MQTT</h2>
      <span class="dica">Tudo o que passa pelo broker local, da mensagem mais nova para a mais antiga.</span></div>
    <div class="trafego"><table>
      <thead><tr><th>Hora</th><th>De</th><th>Tópico</th><th>Mensagem</th></tr></thead>
      <tbody></tbody></table></div>`;
  document.getElementById("principal").appendChild(painel);
  tabela = painel.querySelector("tbody");
  ciclo();
}
iniciar();
</script>
