# Gera o Simulador PTL (.exe portátil para Windows) e publica na página de Releases do repositório.
# Rodar: aba Actions > "Gerar .exe do simulador" > Run workflow. Também roda ao criar uma tag v*.
name: Gerar .exe do simulador

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar o .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --version && npm run preparar && npx electron-builder --win portable --publish never

      - name: Guardar o .exe na execução
        uses: actions/upload-artifact@v4
        with:
          name: Simulador_PTL
          path: app-desktop/dist/*.exe

      - name: Publicar na página de Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="v$(node -p "require('./package.json').version")"
          EXE=$(ls dist/*.exe)
          NOTAS="Simulador Pick-to-Light para Windows: baixe o .exe e abra com duplo clique (não precisa instalar nem de internet). Na primeira vez o Windows pode avisar que o app não é assinado: clique em 'Mais informações' e 'Executar assim mesmo'. Gerado a partir do commit ${GITHUB_SHA::7}."
          if gh release view "$VERSAO" >/dev/null 2>&1; then
            gh release upload "$VERSAO" "$EXE" --clobber
            gh release edit "$VERSAO" --notes "$NOTAS"
          else
            gh release create "$VERSAO" "$EXE" --title "Simulador PTL $VERSAO" --notes "$NOTAS" --target "$GITHUB_SHA"
          fi
